<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your workspace — Flowly</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%233355FF'/><path d='M9 20c4 0 4-8 8-8s4 8 8 8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="ws">
    <aside class="ws__side">
      <a href="index.html" class="brand brand--light">
        <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9"/><path d="M9 20c4 0 4-8 8-8s4 8 8 8"/></svg></span>
        Flowly
      </a>
      <nav class="ws__nav" aria-label="Workspace">
        <a href="#" class="is-active" aria-current="page">Board</a>
        <a href="index.html#features">Features</a>
        <a href="index.html#pricing">Upgrade plan</a>
        <a href="index.html#contact">Get help</a>
      </nav>
      <div class="ws__me">
        <span class="avatar" id="wsAvatar" style="display:grid;place-items:center"></span>
        <div><p id="wsName"></p><small id="wsPlan"></small></div>
      </div>
    </aside>

    <main class="ws__main">
      <div class="ws__top">
        <div>
          <h1 id="wsGreeting">Your workspace</h1>
          <p>Drag cards between columns, or use the buttons. Double-click a title to rename it.</p>
        </div>
        <div class="ws__tools">
          <button class="icon-btn" id="themeToggle" aria-label="Switch theme">
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button class="btn btn--ghost" id="wsSignOut">Sign out</button>
        </div>
      </div>

      <div class="ws__cards">
        <div class="ws__card"><strong id="cTodo">0</strong><p>To do</p></div>
        <div class="ws__card"><strong id="cDoing">0</strong><p>In progress</p></div>
        <div class="ws__card"><strong id="cDone">0</strong><p>Done</p></div>
      </div>

      <form class="ws__add" id="addForm">
        <label class="sr-only" for="newTask">New task</label>
        <input id="newTask" placeholder="Add a task, e.g. Review Q3 budget" maxlength="140" autocomplete="off">
        <button class="btn btn--primary" type="submit">Add task</button>
      </form>

      <div class="board" id="board">
        <p class="ws__loading">Loading your board…</p>
      </div>
    </main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/workspace.js"></script>
</body>
</html>
